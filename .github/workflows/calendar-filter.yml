name: Calendar Filter

on:
  # Run daily at 10:00 UTC (5:00 AM EST / 6:00 AM EDT).
  # GitHub Actions cron uses UTC; Eastern Standard Time is UTC-5, so 5 AM EST
  # equals 10:00 UTC.  During daylight saving time (EDT, UTC-4) this runs at
  # 6:00 AM ET.  Adjust the cron expression if you prefer the EDT offset.
  schedule:
    - cron: "0 10 * * *"

  # Allow manual execution from the Actions tab (or via the GitHub API).
  workflow_dispatch:

jobs:
  filter:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit the generated feed back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: pip install -r src/requirements.txt

      - name: Run calendar filter
        run: python src/filter_calendar.py config.yml output/filtered.ics

      - name: Commit and push filtered feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/filtered.ics
          # Only commit when the feed actually changed
          git diff --staged --quiet || \
            git commit -m "chore: update filtered calendar feed [skip ci]"
          git push
